pluginGroup=com.pumpkin.intellij
pluginName=Pumpkin Support
pluginVersion=1.0.4
pluginSinceBuild=241
pluginUntilBuild=262.*

platformType=IU
# Exact build (not a marketing version) so the plugin compiles/verifies against the specific
# 2026.2 EAP build IU-262.10315.125 the user needs compatibility with.
platformVersion=262.10315.125
# The "Gherkin" marketplace plugin (plugin marketplace ID 9164, XML ID "gherkin").
# Provides GherkinFile, GherkinScenario, GherkinStep, GherkinTable, etc. PSI classes.
# Version 262.8665.173 is compatible with any 262.* build (confirmed via the plugin repo's own
# updates API: since=262.8665, until=262.*), including 262.10315.125 above.
# The "Cucumber for Java" plugin (plugin 7212) depends on this plugin.
# "com.intellij.database" (Database Tools and SQL, bundled with Ultimate only) is compileOnly here
# so the Workflow Assertion generator can reference its API - it's declared optional in plugin.xml
# so the plugin still installs and runs on Community without that one feature.
platformPlugins=gherkin:262.8665.173,com.intellij.java,com.intellij.modules.json,com.intellij.database

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
