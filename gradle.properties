pluginGroup=com.pumpkin.intellij
pluginName=Pumpkin Support
pluginVersion=1.0.8-SNAPSHOT
pluginSinceBuild=241
pluginUntilBuild=262.*

platformType=IU
# Exact build (not a marketing version) so the plugin compiles/verifies against the specific
# 2026.2 EAP build IU-262.10315.125 the user needs compatibility with.
platformVersion=262.10315.125
# Bundled plugins/modules and the non-bundled "Gherkin" marketplace dependency are declared
# directly in build.gradle.kts's dependencies { intellijPlatform { ... } } block (the
# IntelliJ Platform Gradle Plugin 2.x replacement for this project's old single
# comma-separated platformPlugins property) - see that file's own comments for what each one is
# for. "com.intellij.database" (Database Tools and SQL, bundled with Ultimate only) is compileOnly
# there so the Workflow Assertion generator can reference its API - it's declared optional in
# plugin.xml so the plugin still installs and runs on Community without that one feature.

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
