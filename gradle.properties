pluginGroup=com.pumpkin.intellij
pluginName=Pumpkin Support
pluginVersion=1.0.1
pluginSinceBuild=241
pluginUntilBuild=261.*

platformType=IU
platformVersion=2026.1
# The "Gherkin" marketplace plugin (plugin marketplace ID 9164, XML ID "gherkin").
# Provides GherkinFile, GherkinScenario, GherkinStep, GherkinTable, etc. PSI classes.
# Version 261.22158.182 is compatible with IntelliJ 2026.1 (build 261.*).
# The "Cucumber for Java" plugin (plugin 7212) depends on this plugin.
# "com.intellij.database" (Database Tools and SQL, bundled with Ultimate only) is compileOnly here
# so the Workflow Assertion generator can reference its API - it's declared optional in plugin.xml
# so the plugin still installs and runs on Community without that one feature.
platformPlugins=gherkin:261.22158.182,com.intellij.java,com.intellij.modules.json,com.intellij.database

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
